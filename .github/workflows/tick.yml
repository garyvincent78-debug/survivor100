name: tick
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
concurrency:
  group: survivor100
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Code de confiance (copie du commit TRUST_SHA)
        env:
          TRUST_SHA: "0221f8a5ed62a0b8b2ab3569a92acd2a7e300a21"
        run: |
          mkdir -p /tmp/core
          if [ -n "$TRUST_SHA" ]; then
            for k in 1 2 3; do git fetch -q --depth=1 origin "$TRUST_SHA" && break; sleep 5; done
            git archive FETCH_HEAD run.mjs engine.js loop.sh | tar -x -C /tmp/core || { echo "TRUST_SHA introuvable" >&2; exit 1; }
          else
            cp run.mjs engine.js loop.sh /tmp/core/
          fi
      - run: bash /tmp/core/loop.sh
        env:
          GH_TOKEN: ${{ github.token }}
          FIRECRAWL_KEY: ${{ secrets.FIRECRAWL_KEY }}
